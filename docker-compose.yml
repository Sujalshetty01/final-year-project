
version: '3.8'

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - malware-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000"
    volumes:
      - ./grafana-dashboard.json:/etc/grafana/provisioning/dashboards/malware-dashboard.json
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - malware-net
    restart: unless-stopped
  # Backend API Service
  backend:
    build:
      context: ./backend
    container_name: malware-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      PYTHONPATH: "/app"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# Frontend Service (moved to top-level)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: malware-frontend
    ports:
      - "4100:80"
    environment:
      # For Docker Compose, use backend service name for API URL
      REACT_APP_API_URL: "http://backend:8000/api/v1" # Only works inside Docker Compose
    networks:
      - malware-net
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: malware-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-malware_user}
      POSTGRES_USER: ${POSTGRES_USER:-malware_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-malware_pass}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      backend:
        build:
          context: ./backend
        container_name: malware-api
        ports:
          - "8000:8000" # Expose backend API on host and Docker network
        env_file:
          - .env
        environment:
          PYTHONPATH: "/app"
        healthcheck:
          test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
          interval: 30s
          timeout: 10s
          retries: 5
          start_period: 30s
        # Resource limits
        deploy:
          resources:
            limits:
              memory: 4G
            reservations:
              memory: 2G
        depends_on:
          db:
            condition: service_healthy
        logging:
          driver: "json-file"
          options:
            max-size: "10m"
            max-file: "3"
    driver: bridge

volumes:
  pgdata:
    driver: local
  models:
    driver: local
