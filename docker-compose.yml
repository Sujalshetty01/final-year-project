# Docker Compose for Malware Classification System
# Orchestrates backend API, frontend, and supporting services

version: '3.8'

services:
  # Backend API Service
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: malware-api
    ports:
      - "${API_PORT:-8001}:8000"
    environment:
      # API Configuration
      API_HOST: "0.0.0.0"
      API_PORT: "8000"
      DEBUG: "${DEBUG:-false}"
      
      # CORS Configuration
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:8080}"
      
      # Model Configuration
      MODEL_DIR: "${MODEL_DIR:-./models}"
      GNN_MODEL_PATH: "${GNN_MODEL_PATH:-./models/gnn_model.pt}"
      BASELINE_MODEL_DIR: "${BASELINE_MODEL_DIR:-./models/baseline}"
      
      # Rate Limiting
      RATE_LIMIT_ENABLED: "${RATE_LIMIT_ENABLED:-true}"
      RATE_LIMIT_REQUESTS: "${RATE_LIMIT_REQUESTS:-100}"
      RATE_LIMIT_WINDOW: "${RATE_LIMIT_WINDOW:-60}"
      
      # API Security
      API_KEY_ENABLED: "${API_KEY_ENABLED:-false}"
      API_KEY: "${API_KEY:-}"
      
      # Inference Configuration
      INFERENCE_TIMEOUT: "${INFERENCE_TIMEOUT:-60}"
      BATCH_SIZE: "${BATCH_SIZE:-32}"
      MAX_CACHE_SIZE: "${MAX_CACHE_SIZE:-1000}"
      CACHE_TTL_SECONDS: "${CACHE_TTL_SECONDS:-3600}"
      
      # Graph Configuration
      GRAPH_MAX_NODES: "${GRAPH_MAX_NODES:-1000}"
      GRAPH_TIMEOUT: "${GRAPH_TIMEOUT:-30}"
      
      # PyTorch Configuration
      CUDA_VISIBLE_DEVICES: "${CUDA_VISIBLE_DEVICES:-}"
      PYTORCH_CUDA_ALLOC_CONF: "${PYTORCH_CUDA_ALLOC_CONF:-}"
      # Ensure Python can import the `app` package when containers mount volumes
      PYTHONPATH: "/app"
    
    volumes:
      - ./backend/models:/app/models
      - ./backend/app:/app/app
    
    networks:
      - malware-net
    
    restart: unless-stopped
    
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    
    depends_on:
      - healthcheck-init
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
  
  # Frontend Service
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: malware-frontend
    ports:
      - "8082:8080"
    environment:
      REACT_APP_API_URL: "${API_URL:-http://localhost:8001/api/v1}"
    
    volumes:
      - ./frontend/public:/app
    
    networks:
      - malware-net
    
    restart: unless-stopped
    
    depends_on:
      - backend
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
  
  # Initialization service for health checks
  healthcheck-init:
    image: curlimages/curl:latest
    container_name: healthcheck-init
    command: echo "Services will be monitored for health"
    networks:
      - malware-net

# Network definition
networks:
  malware-net:
    driver: bridge

# Volume definitions
volumes:
  models:
    driver: local
