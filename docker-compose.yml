# Docker Compose for Malware Classification System
# Orchestrates backend API, frontend, and supporting services

version: '3.8'

services:
  # Backend API Service
  backend:
    build:
      context: ./backend
    container_name: malware-api
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      PYTHONPATH: "/app"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    depends_on:
      - healthcheck-init
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
  
  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: malware-frontend
    ports:
      - "8090:8080"
    environment:
      REACT_APP_API_URL: "${API_URL:-http://localhost:8001/api/v1}"
    # volumes removed to prevent overwriting /app in production
    networks:
      - malware-net
    restart: unless-stopped
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
  
  # Initialization service for health checks
  healthcheck-init:
    image: curlimages/curl:latest
    container_name: healthcheck-init
    command: echo "Services will be monitored for health"
    networks:
      - malware-net

# Network definition
networks:
  malware-net:
    driver: bridge

# Volume definitions
volumes:
  models:
    driver: local
