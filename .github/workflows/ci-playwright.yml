name: CI Playwright E2E

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install system deps for Playwright (skip on hosted runner)
        run: |
          echo "Skipping apt-get install of system packages on hosted runner."
          echo "Playwright browser dependencies will be installed by 'python -m playwright install --with-deps' below."

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          pip install -r backend/requirements.txt || true
          playwright install --with-deps

      - name: Build and start services
        run: |
          docker compose up -d --build
          sleep 5

      - name: Wait for backend health
        run: |
          for i in {1..30}; do
            if curl -sSf http://localhost:8000/api/v1/health > /dev/null; then
              echo "backend healthy"; exit 0
            fi
            sleep 1
          done
          docker compose logs --no-color || true
          docker compose down --remove-orphans || true
          exit 1

      - name: Run Playwright E2E
        run: |
          python scripts/playwright_e2e.py

      - name: Tear down
        run: |
          docker compose down --remove-orphans
