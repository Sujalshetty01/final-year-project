name: CI Playwright E2E

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install system deps for Playwright
        run: sudo apt-get update && sudo apt-get install -y libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libx11-xcb1 libxcomposite1 libxrandr2 libgbm1 libasound2 libpangocairo-1.0-0 libgtk-3-0

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          # Install dev/test dependencies (Playwright + pytest-playwright)
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; else pip install playwright; fi
          # Backend requirements (best-effort)
          pip install -r backend/requirements.txt || true
          # Install browser engines for Playwright
          python -m playwright install --with-deps

      - name: Build and start services
        run: |
          docker compose up -d --build
          sleep 5

      - name: Wait for backend health
        run: |
          for i in {1..30}; do
            if curl -sSf http://localhost:8000/api/v1/health > /dev/null; then
              echo "backend healthy"; exit 0
            fi
            sleep 1
          done
          docker compose logs --no-color || true
          docker compose down --remove-orphans || true
          exit 1

      - name: Run Playwright E2E
        run: |
          python scripts/playwright_e2e.py

      - name: Tear down
        run: |
          docker compose down --remove-orphans
