name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Minimal, secure permissions for the workflow (use built-in GITHUB_TOKEN)
permissions:
  contents: write
  actions: write
  packages: write
  id-token: write

env:
  ACTIONS_STEP_DEBUG: 'true'   # enable step debug logging (repo-level settings may be required)

jobs:
  smoke-test:
    name: Smoke tests
    runs-on: ubuntu-latest
    env:
      BACKEND_BASE_URL: http://127.0.0.1:8000
      MAX_AUTO_FIXES: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc curl

      - name: Install Python dependencies (runner)
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt || true

      - name: Build backend Docker image (capture logs)
        run: |
          echo "Building backend image..."
          docker build --progress=plain -f backend/Dockerfile -t backend-ci:latest . > backend-build.log 2>&1 || true

      - name: Build frontend Docker image (capture logs)
        run: |
          echo "Building frontend image (if present)..."
          if [ -f ./frontend/Dockerfile ]; then
            docker build --progress=plain -f frontend/Dockerfile -t frontend-ci:latest ./frontend > frontend-build.log 2>&1 || true
          else
            echo 'No frontend Dockerfile; skipping' > frontend-build.log
          fi

      - name: Start backend (container or direct)
        run: |
          # Try to start the backend in a container; if that fails (e.g., docker hub auth),
          # fall back to launching uvicorn directly in the runner.
          set -e
          echo "Attempting to start backend container..."
          if docker run -d --name test-backend -p 8000:8000 backend-ci:latest > /dev/null 2>&1; then
            echo "Backend started in container"
            echo "BACKEND_MODE=container" >> $GITHUB_ENV
          else
            echo "Container start failed, falling back to direct uvicorn run"
            # Ensure Python deps are available (installed earlier). Start uvicorn in background.
            export PYTHONPATH=.
            nohup python -m uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 > backend-uvicorn.log 2>&1 &
            echo $! > backend.pid || true
            echo "Backend started as process (uvicorn)"
            echo "BACKEND_MODE=process" >> $GITHUB_ENV
          fi

      - name: Wait for backend health (more tolerant)
        run: |
          echo "Waiting for backend readiness (/api/v1/ready or /api/v1/health)..."
          # Try /ready first (should become true when models are loaded), fall back to /health
          for i in {1..60}; do
            echo "Attempt $i: probing /api/v1/ready"
            if curl -sSf --max-time 3 http://127.0.0.1:8000/api/v1/ready; then
              echo "backend ready"; exit 0
            fi
            echo "Attempt $i: probing /api/v1/health"
            if curl -sSf --max-time 3 http://127.0.0.1:8000/api/v1/health; then
              echo "backend healthy (health endpoint responded)"; exit 0
            fi
            # show recent container logs to help debugging in CI logs
            if docker ps -a --filter "name=test-backend" --format "{{.Names}}" | grep -q test-backend; then
              echo "---- recent backend logs (tail 50) ----"
              docker logs --tail 50 test-backend || true
              echo "---- end logs ----"
            fi
            sleep 5
          done
          echo "backend did not become healthy after extended wait"; exit 1

      - name: Run smoke tests
        run: |
          set -o pipefail
          echo 'Running smoke tests -> smoke.log'
          python backend/tests/smoke_test.py > smoke.log 2>&1

      - name: Run auth smoke tests
        run: |
          set -o pipefail
          echo 'Running auth tests -> auth.log'
          python backend/tests/auth_test.py > auth.log 2>&1

      - name: Run evaluation smoke test
        run: |
          set -o pipefail
          echo 'Running eval tests -> eval.log'
          python backend/tests/eval_test.py > eval.log 2>&1

      # Note: job/step summary via API removed to avoid external API calls from runner.
      # Failure detection and summary are generated from local logs below.

      - name: Collect backend container logs (on failure)
        if: failure()
        run: |
          docker logs test-backend > backend-uvicorn.log || true
          docker inspect test-backend > backend-inspect.json || true

      - name: Collect docker build logs (always)
        if: always()
        run: |
          ls -l backend-build.log frontend-build.log || true

      - name: Generate and print FAILURE SUMMARY from local logs
        if: failure()
        run: |
          echo 'Scanning local logs to generate failure summary...'
          SUMMARY=failure_summary_${{ github.run_id }}.txt
          echo "Run: ${{ github.run_id }}" > "$SUMMARY"
          echo "Repository: ${{ github.repository }}" >> "$SUMMARY"
          echo "Workflow: ${{ github.workflow }}" >> "$SUMMARY"
          echo "Job: ${{ github.job }}" >> "$SUMMARY"
          echo "" >> "$SUMMARY"

          echo 'Searching for obvious failure signatures...' >> "$SUMMARY"

          # Health check failures
          if grep -q "backend did not become healthy" backend-build.log backend-uvicorn.log smoke.log 2>/dev/null; then
            echo 'Root cause hint: backend health probe failed (service did not start or crashed).' >> "$SUMMARY"
          fi

          # Curl/connect errors
          grep -E "curl: \(7\)|curl: \(56\)|Failed to connect|Connection reset by peer" -H --line-number backend-uvicorn.log smoke.log backend-build.log 2>/dev/null | sed -n '1,20p' >> "$SUMMARY" || true

          # Look for Python tracebacks and ERROR lines in logs
          echo "" >> "$SUMMARY"
          echo "Recent ERROR/Traceback excerpts (from backend-uvicorn.log and smoke.log):" >> "$SUMMARY"
          (grep -nE "Traceback|Exception|ERROR|CRITICAL" backend-uvicorn.log smoke.log 2>/dev/null || true) | sed -n '1,200p' >> "$SUMMARY"

          # Docker build failures (last lines)
          echo "" >> "$SUMMARY"
          echo "Docker build tail (backend-build.log):" >> "$SUMMARY"
          tail -n 200 backend-build.log 2>/dev/null >> "$SUMMARY" || true

          # Container inspect quick info
          echo "" >> "$SUMMARY"
          echo "Container inspect (short):" >> "$SUMMARY"
          if [ -f backend-inspect.json ]; then
            jq '.State, .Config' backend-inspect.json 2>/dev/null | sed -n '1,200p' >> "$SUMMARY" || true
          fi

          # Print to console with delimiters
          echo '--- FAILURE SUMMARY START ---'
          sed -n '1,400p' "$SUMMARY" || true
          echo '--- FAILURE SUMMARY END ---'

      - name: Expose FAILURE SUMMARY as grouped console output
        if: failure()
        run: |
          SUMMARY=failure_summary_${{ github.run_id }}.txt
          if [ -f "$SUMMARY" ]; then
            echo "::group::FAILURE SUMMARY (full)"
            cat "$SUMMARY" || true
            echo "::endgroup::"
          else
            echo "No failure summary to display.";
          fi

      - name: Auto-fix and push (attempt limited automated fixes)
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          echo 'Attempting automated fix pass (conservative)'
          SUMMARY=failure_summary_${{ github.run_id }}.txt
          if [ ! -f "$SUMMARY" ]; then
            echo 'No failure summary present; skipping auto-fix'; exit 0
          fi
          python .github/auto_fix.py --summary "$SUMMARY" --max-fixes ${{ env.MAX_AUTO_FIXES }} || true

      - name: Print collected logs (backend-uvicorn, smoke, build) for immediate inspection
        if: failure()
        run: |
          echo "::group::Backend Uvicorn Log (backend-uvicorn.log)"
          if [ -f backend-uvicorn.log ]; then
            sed -n '1,400p' backend-uvicorn.log || true
          else
            echo "backend-uvicorn.log not present"
          fi
          echo "::endgroup::"

          echo "::group::Smoke test log (smoke.log)"
          if [ -f smoke.log ]; then
            sed -n '1,400p' smoke.log || true
          else
            echo "smoke.log not present"
          fi
          echo "::endgroup::"

          echo "::group::Backend build tail (backend-build.log)"
          if [ -f backend-build.log ]; then
            tail -n 400 backend-build.log || true
          else
            echo "backend-build.log not present"
          fi
          echo "::endgroup::"

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-artifacts
          path: |
            backend-uvicorn.log
            backend-inspect.json
            backend-build.log
            frontend-build.log
            run_${{ github.run_id }}_logs.zip
            run_${{ github.run_id }}_logs
            failure_summary_${{ github.run_id }}.txt
            smoke.log
            auth.log
            eval.log

      - name: Cleanup backend container
        if: always()
        run: |
          docker rm -f test-backend || true
