name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  smoke-test:
    name: Smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Start backend app
        run: |
          nohup python -m uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 > uvicorn.out 2>&1 &
          # give server time to start
          sleep 8

      - name: Run smoke tests
        run: |
          python backend/tests/smoke_test.py

      - name: Run auth smoke tests
        run: |
          python backend/tests/auth_test.py

      - name: Show uvicorn logs on failure
        if: failure()
        run: tail -n 200 uvicorn.out || true
