name: Build Paper (LaTeX)

on:
  workflow_dispatch: {}
  push:
    branches: [ main, master ]

jobs:
  build-paper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install TeX Live (full)
        run: |
          sudo apt-get update -y
          # Install the full TeX Live distribution to avoid missing LaTeX packages
          sudo apt-get install -y texlive-full

      - name: Verify pdflatex
        run: pdflatex --version

      - name: Create output dir
        run: mkdir -p paper

      - name: Compile paper (1st run)
        run: |
          mkdir -p paper || true
          pdflatex -interaction=nonstopmode -output-directory paper paper/ieee_paper_main.tex 2>&1 | tee paper/build.log

      - name: Compile paper (2nd run)
        run: |
          pdflatex -interaction=nonstopmode -output-directory paper paper/ieee_paper_main.tex 2>&1 | tee -a paper/build.log

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: paper-pdf
          path: paper/ieee_paper_main.pdf

      - name: Upload build log
        if: failure() || success()
        uses: actions/upload-artifact@v4
        with:
          name: paper-build-log
          path: paper/build.log
