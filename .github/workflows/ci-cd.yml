name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Quality checks
  code-quality:
    runs-on: ubuntu-latest
    name: Code Quality Checks
    
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install flake8 pytest pytest-cov black isort mypy
      
      - name: Lint with flake8
        run: |
          flake8 backend/app --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 backend/app --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics
      
      - name: Check code formatting with black
        run: black --check backend/app
      
      - name: Check import sorting with isort
        run: isort --check-only backend/app
  
  # Unit tests
  tests:
    runs-on: ubuntu-latest
    name: Unit Tests
    needs: code-quality
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov
      
      - name: Run tests with pytest
        run: |
          pytest backend/app --cov=backend/app --cov-report=xml
      
      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
  
  # Security scanning
  security:
    runs-on: ubuntu-latest
    name: Security Scanning
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety
      
      - name: Run Bandit security scan
        run: bandit -r backend/app -f json -o bandit-report.json
        continue-on-error: true
      
      - name: Check dependencies with Safety
        run: safety check --json
        continue-on-error: true
  
  # Docker build
  docker:
    runs-on: ubuntu-latest
    name: Docker Build
    needs: tests
    if: github.event_name == 'push'
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Build backend image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: malware-classification:latest
      
      - name: Build frontend image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          tags: malware-classification-frontend:latest
  
  # Documentation
  docs:
    runs-on: ubuntu-latest
    name: Documentation Check
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Check README exists
        run: test -f README.md
      
      - name: Validate markdown
        run: |
          pip install mdlint
          mdlint README.md || true
