name: CI - Smoke Test

on:
  push:
  pull_request:

jobs:
  smoke-test:
    name: Smoke test (ONNX)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # install minimal CPU deps; backend/requirements references requirements-cpu
          pip install -r requirements-cpu.txt || true
          pip install -r backend/requirements.txt || true

      - name: Run smoke test (if model exists)
        run: |
          set -o pipefail
          mkdir -p test-output
          if [ -f out/models/model.onnx ]; then
            python scripts/smoke_test.py --model out/models/model.onnx > test-output/smoke_result.json 2>&1 || true
          else
            echo '{"ok": false, "error": "no_model"}' > test-output/smoke_result.json
          fi

      - name: Upload smoke test results
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results
          path: test-output/smoke_result.json

  checks:
    name: Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest || true

      - name: Run flake8 (if config present)
        run: |
          if [ -f .flake8 ] || grep -q "flake8" requirements-cpu.txt || grep -q "flake8" backend/requirements.txt; then
            flake8 || exit 1
          else
            echo "No flake8 configured; skipping"
          fi

      - name: Run pytest (if tests folder exists)
        run: |
          if [ -d tests ] || [ -d backend/tests ]; then
            pytest -q
          else
            echo "No tests found; skipping"
          fi
