name: CI - Smoke Test

on:
  push:
  pull_request:

jobs:
  smoke-test:
    name: Smoke test (ONNX)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # install minimal CPU deps; backend/requirements references requirements-cpu
          pip install -r requirements-cpu.txt || true
          pip install -r backend/requirements.txt || true

      - name: Run smoke test (if model exists)
        run: |
          set -o pipefail
          mkdir -p test-output
          if [ -f out/models/model.onnx ]; then
            python scripts/smoke_test.py --model out/models/model.onnx > test-output/smoke_result.json 2>&1 || true
          else
            echo '{"ok": false, "error": "no_model"}' > test-output/smoke_result.json
          fi

      - name: Upload smoke test results
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results
          path: test-output/smoke_result.json

  checks:
    name: Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest || true

      - name: Run flake8 (if config present)
        run: |
          if [ -f .flake8 ] || grep -q "flake8" requirements-cpu.txt || grep -q "flake8" backend/requirements.txt; then
            flake8 || exit 1
          else
            echo "No flake8 configured; skipping"
          fi

      - name: Run pytest (if tests folder exists)
        run: |
          if [ -d tests ] || [ -d backend/tests ]; then
            pytest -q
          else
            echo "No tests found; skipping"
          fi

  docker-integration:
    name: Docker integration
    runs-on: ubuntu-latest
    needs: [smoke-test, checks]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        run: |
          docker build -t dl-malware-api:ci .

      - name: Run container
        run: |
          docker run -d --rm --name dl-malware-api-ci -p 8000:8000 dl-malware-api:ci || true

      - name: Wait for /health
        run: |
          for i in $(seq 1 20); do
            if curl -sSf http://localhost:8000/health > /dev/null; then
              echo 'service up'; exit 0
            fi
            sleep 3
          done
          echo 'service did not start' && docker logs dl-malware-api-ci || true
          exit 1

      - name: Run simple integration checks
        run: |
          mkdir -p integration-output
          curl -sS -X GET http://localhost:8000/health -o integration-output/health.json || true
          curl -sS -X POST -H "Content-Type: application/json" -d '{"flows":[{"src":"10.0.0.1","dst":"8.8.8.8","bytes":123}]}' http://localhost:8000/api/v1/analyze -o integration-output/analyze.json || true

      - name: Upload integration results
        uses: actions/upload-artifact@v4
        with:
          name: integration-results
          path: integration-output

      - name: Stop container
        if: always()
        run: |
          docker stop dl-malware-api-ci || true
 
      - name: Setup Python for integration tests
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests

      - name: Run pytest integration tests against container
        run: |
          pytest -q backend/tests/test_integration_http.py
