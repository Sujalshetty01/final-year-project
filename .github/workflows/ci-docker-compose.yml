name: CI Docker Compose Smoke

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and start services
        run: |
          docker compose up -d --build
          # wait a bit for containers to start
          sleep 5

      - name: Wait for backend health
        run: |
          for i in {1..30}; do
            if curl -sSf http://localhost:8000/api/v1/health > /dev/null; then
              echo "backend healthy"; exit 0
            fi
            sleep 1
          done
          docker compose logs --no-color || true
          docker compose down --remove-orphans || true
          exit 1

      - name: Wait for frontend
        run: |
          for i in {1..20}; do
            if curl -sSf http://localhost:8082/ > /dev/null; then
              echo "frontend up"; exit 0
            fi
            sleep 1
          done
          docker compose logs --no-color || true
          docker compose down --remove-orphans || true
          exit 1

      - name: Run smoke API checks
        run: |
          curl -sSf http://localhost:8000/api/v1/health
          curl -sSf http://localhost:8000/api/v1/ready
          python3 scripts/run_sample_analyze.py

      - name: Tear down
        run: |
          docker compose down --remove-orphans
